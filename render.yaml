# Render Blueprint for the hosted Orbit demo (SCRUM-41). Setup and rollback: docs/deploy.md
# Every secret is `sync: false`: Render asks for the value when the Blueprint is
# first applied and never reads it from this file or from backend/.env.
#
# Auto-deploy is OFF: deploys are triggered by .github/workflows/deploy.yml after
# CI passes on main (or by a manual run / the Render dashboard).

envVarGroups:
  # Shared by the API and the Celery worker (both run the same image and code).
  - name: orbit-backend-secrets
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CLERK_JWT_KEY
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      # Leave empty for AWS S3; set for an S3-compatible store (e.g. Cloudflare R2).
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      # Gmail OAuth (Story 3)
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # Set once, never rotate: it encrypts stored Gmail tokens.
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      # https://<api host>/api/team/gmail/oauth/callback/
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false

services:
  - type: web
    name: orbit-api
    runtime: docker
    plan: starter            # preDeployCommand needs a paid instance
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /api/health/
    # Runs before the new version takes traffic; a failure aborts the deploy.
    preDeployCommand: python manage.py migrate --noinput && python manage.py seed_demo
    envVars:
      - fromGroup: orbit-backend-secrets
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString
      # e.g. orbit-api.onrender.com (comma-separated, no scheme)
      - key: ALLOWED_HOSTS
        sync: false
      # e.g. https://orbit-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      # clerk_<Clerk user id> of the demo account; empty skips seeding.
      - key: DEMO_SEED_USERNAME
        sync: false

  - type: worker
    name: orbit-worker
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: false
    dockerCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: orbit-backend-secrets
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: orbit-redis
          property: connectionString

  - type: keyvalue
    name: orbit-redis
    plan: free
    region: virginia
    # Celery needs queued jobs kept, not evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []          # internal network only

  - type: web
    name: orbit-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      # https://orbit-api.onrender.com (no trailing slash)
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: orbit-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []          # internal network only
