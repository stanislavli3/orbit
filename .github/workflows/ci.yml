name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      - name: Format (ruff format)
        run: ruff format --check .

      - name: Django system check
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          CLERK_ISSUER: https://ci.clerk.dev
          DEBUG: "True"
        run: python manage.py check

      - name: Run migrations
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          CLERK_ISSUER: https://ci.clerk.dev
          DEBUG: "True"
        run: python manage.py migrate --run-syncdb

      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-a-real-secret
          CLERK_ISSUER: https://ci.clerk.dev
          DEBUG: "True"
        # Exit code 5 = no tests collected — acceptable until test suite is built out
        run: pytest -q || [ $? -eq 5 ]

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    # Non-blocking on PRs — audit results appear as annotations only
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-audit-${{ hashFiles('backend/requirements.txt') }}

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Node dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
